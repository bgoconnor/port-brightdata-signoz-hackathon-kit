name: Validate reproduction

on:
  workflow_dispatch:
    inputs:
      reproduction_id:
        description: Port Reproduction entity identifier
        required: true
        type: string
      candidate_code:
        description: Generated Python candidate
        required: true
        type: string
      retry_count:
        description: Number of repairs already attempted
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CANDIDATE_CODE: ${{ inputs.candidate_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize candidate without shell interpolation
        shell: python
        run: |
          import os
          from pathlib import Path
          Path("candidate.py").write_text(os.environ["CANDIDATE_CODE"])

      - name: Prepare fixed sandbox image
        run: docker pull python:3.12-slim

      - name: Validate in isolated container
        id: validation
        continue-on-error: true
        run: python3 -m factory.validate_candidate candidate.py --result validation-result.json

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-${{ inputs.reproduction_id }}-evidence
          path: validation-result.json
          if-no-files-found: error

      - name: Report result to Port
        if: always()
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          python3 -m factory.report_to_port \
            --result validation-result.json \
            --entity "${{ inputs.reproduction_id }}" \
            --retry-count "${{ inputs.retry_count }}"

      - name: Fail workflow when candidate failed
        if: steps.validation.outcome != 'success'
        run: exit 1
