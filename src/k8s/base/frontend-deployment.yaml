apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hackathon-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hackathon-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: hackathon-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
