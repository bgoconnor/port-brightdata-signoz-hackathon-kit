apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
resources:
  - ../../base
  - namespace.yaml
  - backend-pvc.yaml
patches:
  - path: backend-local-patch.yaml
images:
  - name: hackathon-backend
    newName: hackathon-backend
    newTag: local
  - name: hackathon-frontend
    newName: hackathon-frontend
    newTag: local
configMapGenerator:
  - name: hackathon-backend-config
    literals:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_DATABASE_PATH=/data/db.sqlite3
      - DJANGO_ENVIRONMENT=local
secretGenerator:
  - name: hackathon-backend-secret
    literals:
      - DJANGO_SECRET_KEY=local-only-insecure-key-do-not-use-in-production
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: paper-factory
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/environment: local

