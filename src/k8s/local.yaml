# Local Minikube only. Production will use a separate manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: hackathon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-postgres
  namespace: hackathon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-postgres
  template:
    metadata:
      labels:
        app: hackathon-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: hackathon
            - name: POSTGRES_USER
              value: hackathon
            - name: POSTGRES_PASSWORD
              value: hackathon
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hackathon
                - -d
                - hackathon
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-postgres
  namespace: hackathon
spec:
  selector:
    app: hackathon-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-backend
  namespace: hackathon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-backend
  template:
    metadata:
      labels:
        app: hackathon-backend
    spec:
      containers:
        - name: backend
          image: hackathon-backend:local
          imagePullPolicy: Never
          env:
            - name: POSTGRES_HOST
              value: hackathon-postgres
            - name: POSTGRES_DB
              value: hackathon
            - name: POSTGRES_USER
              value: hackathon
            - name: POSTGRES_PASSWORD
              value: hackathon
            - name: BRIGHTDATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hackathon-brightdata
                  key: BRIGHTDATA_API_KEY
            - name: BRIGHTDATA_COLLECTOR_ID
              value: c_mt4qssufwcgso7ees
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_SERVICE_NAME
              value: hackathon-backend
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=paper-factory,service.version=local,deployment.environment=local,k8s.pod.ip=$(K8S_POD_IP),k8s.pod.uid=$(K8S_POD_UID),k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(HOST_IP):4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-backend
  namespace: hackathon
spec:
  selector:
    app: hackathon-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-frontend
  namespace: hackathon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-frontend
  template:
    metadata:
      labels:
        app: hackathon-frontend
    spec:
      containers:
        - name: frontend
          image: hackathon-frontend:local
          imagePullPolicy: Never
          env:
            - name: VITE_API_PROXY_TARGET
              value: http://hackathon-backend:8000
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-frontend
  namespace: hackathon
spec:
  selector:
    app: hackathon-frontend
  ports:
    - port: 5173
      targetPort: 5173
